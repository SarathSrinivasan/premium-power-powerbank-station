<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Available PowerBanks</title><script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script><link rel="stylesheet" href="style.css"><script src="config.js"></script><script src="mqtt.js"></script><script src="common.js"></script></head><body><div class="container"><div class="topbar"><button class="back" onclick="location.href='rent.html'">← Back</button><div class="mqtt-pill"><span class="mqtt-dot"></span><span class="mqtt-text">MQTT offline</span></div></div><div class="brand"><div class="logo">🔋</div><h1>Available Power Banks</h1><div class="subtitle">Select a device reported by the STM32</div></div><div class="card"><div class="row"><span class="label">Request ID</span><span class="value" id="request">-</span></div><div id="status" class="status">🟠 Waiting for station availability...</div><div id="list"></div><div id="empty" class="muted">No availability message received yet.</div></div><div class="card"><details><summary>MQTT diagnostic</summary><div id="log" class="log" style="margin-top:10px">Starting…</div></details></div></div><script>PB.mqttStatus();const s=PB.session();if(!s?.request_id||!s?.customer_id){location.href='rent.html'}else{document.getElementById('request').textContent=s.request_id;const status=document.getElementById('status'),list=document.getElementById('list'),empty=document.getElementById('empty'),log=document.getElementById('log');const addLog=x=>{log.textContent+='\n'+new Date().toLocaleTimeString()+' '+x;log.scrollTop=log.scrollHeight};PB_MQTT.subscribe(PB.C.TOPICS.AVAILABILITY);PB_MQTT.onMessage((topic,text)=>{if(topic!==PB.C.TOPICS.AVAILABILITY)return;addLog('RX '+text);let d;try{d=JSON.parse(text)}catch(e){return}if(d.station_id&&d.station_id!==s.station_id)return;if(d.request_id&&d.request_id!==s.request_id)return;const slots=Array.isArray(d.devices)?d.devices:Array.isArray(d.slots)?d.slots:[];if(d.available===false||!slots.length){status.textContent='🔴 No PowerBank is available right now.';empty.textContent='The station reported no available devices.';return}status.textContent='🟢 PowerBanks available — choose one';empty.classList.add('hidden');list.innerHTML='';slots.forEach((x,i)=>{const id=x.device_id||x.id||('PB'+String(i+1).padStart(3,'0'));const el=document.createElement('div');el.className='choice';el.innerHTML='<b>'+PB.esc(id)+'</b><div class="small">Slot: '+PB.esc(x.slot??'-')+' · Battery: '+PB.esc(x.battery??'-')+'%</div>';el.onclick=()=>{s.device_id=id;s.slot=x.slot??null;s.battery=x.battery??null;PB.save(s);location.href='payment.html'};list.appendChild(el)})});setTimeout(()=>{if(!list.children.length){const msg={event:'RENT_REQUESTED',station_id:s.station_id,station_number:s.station_number,request_id:s.request_id,customer_id:s.customer_id};PB_MQTT.publish(PB.C.TOPICS.RENT_REQUEST,msg);addLog('Repeated RENT_REQUEST for this request ID.')}},800)}</script></body></html>
