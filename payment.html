<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Rental Payment</title><script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script><link rel="stylesheet" href="style.css"><script src="config.js"></script><script src="mqtt.js"></script><script src="common.js"></script></head><body><div class="container"><div class="topbar"><button class="back" onclick="location.href='devices.html'">← Back</button><div class="mqtt-pill"><span class="mqtt-dot"></span><span class="mqtt-text">MQTT offline</span></div></div><div class="brand"><div class="logo">💳</div><h1>Confirm Rental</h1><div class="subtitle">Test payment / command screen</div></div><div class="card" id="card"><div class="row"><span class="label">Device</span><span class="value" id="device">-</span></div><div class="row"><span class="label">Slot</span><span class="value" id="slot">-</span></div><div class="row"><span class="label">Request ID</span><span class="value" id="req">-</span></div><div id="status" class="status">Ready.</div><button class="success" id="paid">PAID — OPEN SLOT</button><button class="secondary" onclick="location.href='index.html'">CANCEL</button></div></div><script>PB.mqttStatus();const s=PB.session();if(!s?.request_id||!s?.device_id){location.href='rent.html'}else{device.textContent=s.device_id;slot.textContent=s.slot??'-';req.textContent=s.request_id;const status=document.getElementById('status');document.getElementById('paid').onclick=()=>{const msg={event:'PAYMENT_SUCCESS',station_id:s.station_id,station_number:s.station_number,request_id:s.request_id,customer_id:s.customer_id,device_id:s.device_id,slot:s.slot,command:'OPEN_SLOT',payment_status:'PAID',timestamp:new Date().toISOString()};PB_MQTT.publish(PB.C.TOPICS.PAYMENT,msg);status.textContent='🟢 Payment accepted. OPEN_SLOT command sent to STM32.';setTimeout(()=>{PB.clear();location.href='index.html'},1800)}};</script></body></html>
